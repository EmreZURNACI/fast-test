<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EmreZURNACI</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .card{
      text-align:center;
      background:#1e293b;
      padding:40px;
      border-radius:20px;
      box-shadow:0 0 30px rgba(0,0,0,.4);
      width:320px;
    }

    h1{
      font-size:38px;
      margin-bottom:10px;
    }

    p{
      color:#cbd5e1;
      margin-bottom:25px;
    }

    a{
      text-decoration:none;
      color:white;
      background:#3b82f6;
      padding:12px 20px;
      border-radius:12px;
      display:inline-block;
      transition:.3s;
    }

    a:hover{
      background:#2563eb;
      transform:scale(1.05);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>EmreZURNACI</h1>
    <p>Vercel üzerinde yayınlanan kişisel sayfa.</p>

    <a href="/go">URI Test</a>
  </div>

</body>
</html>
